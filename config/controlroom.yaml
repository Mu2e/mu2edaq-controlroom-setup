# Central configuration for the Mu2e DAQ control room.
# Precedence everywhere: command line > environment (CRS_*) > this file > defaults.

gateway: mu2egateway01.fnal.gov     # ProxyJump host for all cluster access
personal_user: anorman              # login used on the jump host
install_dir: ~/controlroom          # bin install area on DAQ hosts (~/controlroom/bin goes in PATH)
vnc_password_file: ~/.vnc/passwd    # on the DAQ hosts, per session account

discovery:
  group: 239.255.42.99
  port: 28999
  timeout: 2.0
  announce_interval: 30             # seconds between unsolicited VNC announces (0 = off)

# Shared accounts available on the cluster.
accounts: [mu2eshift, mu2edaq, mu2ecalo, mu2edcs, mu2etrk, mu2etrig]

# Currently-running VNC viewport sessions on mu2e-mgr-01. vnc_port = 5900 + display.
# local_port is the client-side tunnel listen port (legacy 595x convention).
sessions:
  - name: dcs-main
    host: mu2e-mgr-01.fnal.gov
    account: mu2edcs
    display: 1
    geometry: 1920x1080
    depth: 24
    local_port: 5951
  - name: shift-main
    host: mu2e-mgr-01.fnal.gov
    account: mu2eshift
    display: 2
    geometry: 1920x1080
    depth: 24
    local_port: 5952
  - name: trig-main
    host: mu2e-mgr-01.fnal.gov
    account: mu2etrig
    display: 3
    geometry: 1920x1080
    depth: 24
    local_port: 5953
